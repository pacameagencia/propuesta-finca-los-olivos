<style>
:root{
  --ink:#222222; --body:#3F3F3F; --muted:#6A6A6A; --line:#DDDDDD; --line-soft:#EBEBEB; --field:#B0B0B0;
  --surface:#F7F7F7; --surface-2:#F2F2F2;
  --brand:#4E6E2E; --brand-d:#37531F; --brand-t:#EEF3E6; --heart:#E0475B; --wine:#7A0F2C; --wine-d:#580014;
  --shadow-1:0 6px 16px rgba(0,0,0,.12); --shadow-2:0 6px 20px rgba(0,0,0,.2);
  --shadow-pop:0 4px 32px rgba(0,0,0,.16); --shadow-modal:0 8px 28px rgba(0,0,0,.28);
  --ease:cubic-bezier(.2,0,0,1);
  --pad:clamp(24px,4.4vw,80px);
  --hdr-full:168px; --hdr-compact:80px;
  --f:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --strip:32px; --sat:env(safe-area-inset-top,0px); --top:calc(var(--strip) + var(--sat));
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--f);color:var(--ink);background:#fff;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.25}
p{margin:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.lg{width:24px;height:24px;stroke-width:1.6}
.ic.xl{width:32px;height:32px;stroke-width:1.4}
.muted{color:var(--muted)}
.wrap{max-width:1880px;margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
.wrap-l{--pad:clamp(24px,4vw,40px);max-width:1120px;margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
.u{text-decoration:underline;text-underline-offset:2px}
.dot{padding:0 4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Imágenes */
.sk{background:linear-gradient(100deg,var(--surface-2) 30%,#E8E8E8 50%,var(--surface-2) 70%) 0 0/300% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{to{background-position:-150% 0}}
.fi{opacity:0;transition:opacity .45s var(--ease)}
.fi.ld{opacity:1}
img.broken{opacity:0}
.noimg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;height:100%;padding:16px;text-align:center;color:#5A6B45;font-size:13px;line-height:1.3;background:radial-gradient(120% 100% at 25% 15%,#F4F7EE 0%,#E6EDDA 60%,#DCE5CC 100%)}
.noimg svg{width:56px;height:56px;flex:none}
.noimg small{font-size:12px;max-width:26ch}
.sk:has(.noimg){animation:none;background:none}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:8px;font-weight:600;font-size:16px;text-decoration:none;transition:transform .1s var(--ease),background .2s,box-shadow .2s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn-grad{color:#fff;background:radial-gradient(circle at var(--x,50%) var(--y,50%),#A3264A 0%,#7A0F2C 38%,#580014 100%)}
.btn-grad[disabled]{background:#DDDDDD;color:#fff;cursor:not-allowed}
.btn-ink{background:var(--ink);color:#fff}
.btn-ink:hover{background:#000}
.btn-line{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.btn-line:hover{background:var(--surface)}
.btn-wide{width:100%}
.btn-sm{height:40px;padding:0 16px;font-size:14px}
.link{font-weight:600;text-decoration:underline;text-underline-offset:2px;font-size:16px;display:inline-flex;align-items:center;gap:4px}
.circ{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line);transition:transform .15s,box-shadow .2s,opacity .2s}
.circ:hover:not([disabled]){box-shadow:0 2px 4px rgba(0,0,0,.18);transform:scale(1.04)}
.circ[disabled]{opacity:.35;cursor:not-allowed}
.circ .ic{width:12px;height:12px;stroke-width:3}

/* Cabecera */
.hdr{position:fixed;top:var(--top);left:0;right:0;z-index:50;background:#fff;height:var(--hdr-full);border-bottom:1px solid var(--line-soft);transition:height .3s var(--ease),box-shadow .3s}
.hdr-top{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:80px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--brand);justify-self:start}
.brand img{height:50px;width:auto;display:block}
.tabs{display:flex;gap:8px;align-items:stretch;height:80px;transition:opacity .2s,transform .3s var(--ease)}
.tab{display:flex;align-items:center;gap:6px;padding:0 14px;text-decoration:none;color:var(--muted);font-size:16px;font-weight:500;position:relative;transition:color .2s}
.tab:hover{color:var(--ink)}
.tab::after{content:"";position:absolute;left:14px;right:14px;bottom:8px;height:3px;border-radius:3px;background:var(--ink);transform:scaleX(0);transition:transform .3s var(--ease)}
.tab[aria-current="page"]{color:var(--ink);font-weight:600}
.tab[aria-current="page"]::after{transform:scaleX(1)}
.tab .tab-ic{width:52px;height:52px;flex:none;transition:transform .3s var(--ease)}
.tab .tab-ic svg{width:100%;height:100%}
.tab:hover .tab-ic{transform:scale(1.06)}
.tab.bump .tab-ic{animation:bump .6s var(--ease)}
@keyframes bump{30%{transform:scale(.82) rotate(-6deg)}65%{transform:scale(1.14) rotate(3deg)}100%{transform:none}}
.mini{position:absolute;left:50%;top:16px;display:flex;align-items:center;height:48px;padding:0 7px 0 8px;border:1px solid var(--line);border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.05);opacity:0;visibility:hidden;transform:translate(-50%,60px) scale(1.5);transition:opacity .2s,transform .3s var(--ease),visibility .3s,box-shadow .2s}
.mini:hover{box-shadow:0 2px 4px rgba(0,0,0,.18)}
.mini .ms{padding:0 16px;font-size:14px;font-weight:600;white-space:nowrap;position:relative}
.mini .ms+.ms::before{content:"";position:absolute;left:0;top:-4px;bottom:-4px;width:1px;background:var(--line)}
.mini .ms.light{font-weight:400;color:var(--muted)}
.mini .orb{width:34px;height:34px}
.hdr-right{justify-self:end;display:flex;align-items:center;gap:4px}
.hdr-link{display:flex;align-items:center;gap:8px;white-space:nowrap;padding:12px;border-radius:999px;font-size:14px;font-weight:600;text-decoration:none;transition:background .2s}
.hdr-link:hover{background:var(--surface)}
.hdr-link .ic{width:18px;height:18px;stroke-width:1.8}
.menu-btn{display:flex;align-items:center;gap:12px;height:42px;padding:5px 5px 5px 12px;border:1px solid var(--line);border-radius:999px;margin-left:8px;transition:box-shadow .2s}
.menu-btn:hover{box-shadow:0 2px 4px rgba(0,0,0,.18)}
.menu-btn .ic{width:16px;height:16px;stroke-width:2.2}
.menu-btn .av{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}
.menu-btn .av svg{width:20px;height:20px}
.menu-pop{position:absolute;right:var(--pad);top:70px;width:250px;background:#fff;border-radius:12px;box-shadow:var(--shadow-pop);padding:8px 0;z-index:70;animation:popIn .18s var(--ease)}
.menu-pop[hidden]{display:none}
.menu-pop a,.menu-pop button{display:block;width:100%;text-align:left;padding:11px 16px;text-decoration:none;font-size:14px}
.menu-pop a:hover,.menu-pop button:hover{background:var(--surface)}
.menu-pop .strong{font-weight:600}
.menu-pop hr{border:0;border-top:1px solid var(--line-soft);margin:8px 0}
.hdr-search{display:flex;justify-content:center;padding:0 var(--pad);transition:opacity .2s,transform .3s var(--ease)}
.search{display:grid;grid-template-columns:1.1fr .85fr .85fr 1.1fr;align-items:center;width:min(850px,100%);height:66px;border:1px solid var(--line);border-radius:999px;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.1);transition:background .2s}
.search.has-active{background:var(--line-soft)}
.seg{height:66px;display:flex;flex-direction:column;justify-content:center;padding:0 24px 0 32px;border-radius:999px;position:relative;min-width:0;cursor:pointer;transition:background .2s,box-shadow .2s}
.seg:hover{background:var(--line-soft)}
.search.has-active .seg:hover{background:#DDDDDD}
.seg.active,.search.has-active .seg.active{background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.seg+.seg::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:1px;background:var(--line);transition:opacity .2s}
.seg:hover::before,.seg:hover+.seg::before,.seg.active::before,.seg.active+.seg::before,.search.has-active .seg::before{opacity:0}
.seg-l{font-size:12px;font-weight:600}
.seg-v{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg-v.set{color:var(--ink);font-weight:600}
.seg.last{padding:0}
.seg-hit{display:flex;flex-direction:column;justify-content:center;width:100%;height:100%;padding:0 72px 0 32px;border-radius:999px;min-width:0}
.orb{display:flex;align-items:center;justify-content:center;gap:8px;width:48px;height:48px;border-radius:999px;color:#fff;overflow:hidden;white-space:nowrap;transition:width .3s var(--ease),padding .3s var(--ease)}
.orb .ic{width:16px;height:16px;stroke-width:3}
.orb span{font-weight:600;font-size:16px;max-width:0;opacity:0;transition:max-width .3s var(--ease),opacity .2s}
.seg .orb{position:absolute;right:9px;top:9px;z-index:1}
.search.has-active .seg .orb{width:auto;padding:0 18px}
.search.has-active .seg .orb span{max-width:80px;opacity:1}
.m-search{display:none}
.hdr-dim{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.25);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
body.hdr-open .hdr-dim{opacity:1;visibility:visible}
.hdr.compact:not(.open){height:var(--hdr-compact)}
.hdr.compact:not(.open) .tabs{opacity:0;transform:translateY(-12px) scale(.9);pointer-events:none}
.hdr.compact:not(.open) .hdr-search{opacity:0;transform:translateY(-60px) scale(.42,.7);pointer-events:none}
.hdr.compact:not(.open) .mini{opacity:1;visibility:visible;transform:translate(-50%,0) scale(1)}
.hdr.open{box-shadow:var(--shadow-1)}
main{padding-top:calc(var(--hdr-full) + var(--strip))}
body.v-compact main{padding-top:calc(var(--hdr-compact) + var(--strip))}

/* Aviso de propuesta */
.strip{position:fixed;top:0;left:0;right:0;z-index:75;height:var(--top);padding-top:var(--sat);background:var(--ink);color:#fff;font-size:12px;line-height:1.2}
.strip-in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:var(--strip)}
.strip b{font-weight:600}
.strip .r{color:rgba(255,255,255,.75);white-space:nowrap}
.strip a{color:#fff;font-weight:600;text-underline-offset:2px}

/* Filtros */
.chips{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:24px 0 8px}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border:1px solid var(--line);border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap;flex:none;transition:border-color .2s,background .2s,transform .1s}
.chip:hover{border-color:var(--ink)}
.chip:active{transform:scale(.96)}
.chip .ic{width:18px;height:18px;stroke-width:1.7}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--ink)}
.trust{display:flex;list-style:none;margin:0;padding:8px 0 0;overflow-x:auto;scrollbar-width:none;font-size:14px;color:var(--body)}
.trust::-webkit-scrollbar{display:none}
.trust li{display:flex;align-items:center;gap:8px;white-space:nowrap;padding:0 20px;border-left:1px solid var(--line)}
.trust li:first-child{padding-left:0;border-left:0}
.trust .ic{width:16px;height:16px;stroke-width:1.8;color:var(--brand)}
.trust b{font-weight:600;color:var(--ink)}
.summary{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted);padding-top:8px;min-height:22px}

/* Filas */
.row{padding-top:32px}
.row-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
.row-head h2{font-size:22px;font-weight:600;letter-spacing:-.01em}
.row-head p{font-size:14px;color:var(--muted);margin-top:2px}
.row-nav{display:flex;gap:8px;flex:none}
.track{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 4 * 24px) / 5);gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth;padding-bottom:4px}
.track::-webkit-scrollbar{display:none}
.track>*{scroll-snap-align:start;min-width:0}
.track.more{grid-auto-columns:calc((100% - 2 * 24px) / 3)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 24px}
.grid.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.empty{text-align:center;padding:64px 16px;max-width:520px;margin:0 auto}
.empty .ic{width:32px;height:32px;margin:0 auto 16px;stroke-width:1.6}
.empty h2{font-size:22px;margin-bottom:8px}
.empty p{color:var(--muted)}
.empty .acts-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}

/* Tarjeta */
.card{position:relative;min-width:0}
.c-media{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:1/1;transform:translateZ(0)}
.c-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.c-track::-webkit-scrollbar{display:none}
.c-slide{flex:0 0 100%;width:100%;scroll-snap-align:start;height:100%;display:block;text-decoration:none}
.c-slide img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:12px;left:12px;background:#fff;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14);pointer-events:none;max-width:calc(100% - 64px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav{position:absolute;top:10px;right:10px;width:32px;height:32px;display:grid;place-items:center;z-index:2}
.fav::before{content:"";position:absolute;inset:-6px}
.fav svg{width:24px;height:24px;fill:rgba(0,0,0,.5);stroke:#fff;stroke-width:2;transition:fill .2s,transform .2s}
.fav:hover svg{transform:scale(1.08)}
.fav.on svg{fill:var(--heart)}
.pop-anim svg{animation:heart .45s var(--ease)}
@keyframes heart{35%{transform:scale(1.32)}70%{transform:scale(.92)}}
.c-nav{position:absolute;top:50%;width:32px;height:32px;margin-top:-16px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;opacity:0;transition:opacity .2s,transform .2s;box-shadow:0 0 0 1px rgba(0,0,0,.04),0 2px 4px rgba(0,0,0,.18);z-index:2}
.c-nav:hover{background:#fff;transform:scale(1.04)}
.c-nav .ic{width:12px;height:12px;stroke-width:3}
.c-prev{left:12px}.c-next{right:12px}
.card:hover .c-nav{opacity:1}
.card:hover .c-nav[disabled]{opacity:0;pointer-events:none}
.card:focus-within .c-nav:not([disabled]){opacity:1}
@media (hover:none){.c-nav{display:none}}
.c-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
.c-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6);transition:background .2s,transform .2s}
.c-dots i.on{background:#fff;transform:scale(1.15)}
.c-body{position:relative;padding-top:12px;font-size:15px;line-height:1.35}
.c-link{text-decoration:none;display:block;width:100%}
.c-link::after{content:"";position:absolute;inset:0}
.c-name,.c-sub,.c-price{display:block}
.c-name{font-weight:600}
.c-sub{color:var(--muted)}
.c-price{margin-top:4px}
.c-price b{font-weight:600}
.card.exp .c-media{aspect-ratio:4/5}

/* Valoración */
.rating{padding:56px 0 48px;border-top:1px solid var(--line-soft);margin-top:48px}
.rm-top{display:flex;align-items:center;justify-content:center;gap:4px}
.laurel{width:44px;height:84px;color:var(--ink)}
.laurel.r{transform:scaleX(-1)}
.rm-score{font-size:88px;font-weight:700;letter-spacing:-.04em;line-height:1}
.rating h2{text-align:center;font-size:22px;margin-top:8px}
.rating .sub{text-align:center;color:var(--muted);font-size:16px;max-width:480px;margin:6px auto 0}
.rm-cats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin:40px 0 0}
.rm-cat{padding:0 24px;border-left:1px solid var(--line-soft);display:flex;flex-direction:column;gap:2px}
.rm-cat:first-child{border-left:0;padding-left:0}
.rm-cat span{font-size:14px;font-weight:600}
.rm-cat b{font-size:18px;font-weight:600}
.rm-cat .ic{margin-top:24px}
.rm-bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:10px}
.rm-bar i{display:block;height:100%;background:var(--ink);width:0;transition:width 1.1s var(--ease)}
.in .rm-bar i{width:var(--w)}
.review{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;max-width:560px;margin:48px auto 0}
.review .avatar{width:48px;height:48px;border-radius:50%;background:var(--brand-t);color:var(--brand-d);display:grid;place-items:center;font-weight:700;font-size:18px}
.review b{display:block;font-weight:600}
.review small{display:block;color:var(--muted);font-size:14px}
.review p{margin-top:10px;font-size:16px;line-height:1.5}
.stars{display:flex;gap:2px;margin-top:8px}
.stars svg{width:10px;height:10px;fill:var(--ink)}
.center{text-align:center}

/* Secciones */
.sec{padding:48px 0;border-bottom:1px solid var(--line)}
.sec h2{font-size:22px;margin-bottom:24px}
.sec .lede{color:var(--muted);margin-top:-16px;margin-bottom:24px}
.am-grid{list-style:none;padding:0;margin:0 0 32px;display:grid;grid-template-columns:1fr 1fr;gap:16px 24px}
.am-grid li{display:flex;align-items:center;gap:16px;font-size:16px}
.am-grid li.no{text-decoration:line-through;color:var(--muted)}
.am-list{list-style:none;padding:0;margin:0}
.am-list li{display:flex;gap:16px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line-soft);font-size:16px}
.am-list li.no{text-decoration:line-through;color:var(--muted)}
.hl{display:grid;gap:24px}
.hl-item{display:flex;gap:24px;align-items:flex-start}
.hl-item b{display:block;font-weight:600}
.hl-item span{color:var(--muted);font-size:14px}
.desc{font-size:16px;line-height:1.5;max-width:65ch}
.zones{columns:2;column-gap:32px;list-style:none;padding:0;margin:0}
.zones li{break-inside:avoid;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.zones b{display:block;font-weight:600}
.zones span{color:var(--muted);font-size:14px}
.know{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px}
.know h3{font-size:16px;margin-bottom:12px}
.know ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.know li{display:flex;gap:12px;font-size:15px;color:var(--body)}
.know li .ic{margin-top:3px;width:18px;height:18px;stroke-width:1.7}
.sights{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 32px;list-style:none;padding:0;margin:24px 0 0}
.sights b{display:block;margin-top:12px;font-weight:600}
.sights p{color:var(--muted);font-size:14px;margin-top:2px}
.dist{list-style:none;padding:0;margin:0}
.dist li{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line-soft);font-size:15px}
.dist li span:last-child{color:var(--muted);text-align:right}
.map{border-radius:12px;overflow:hidden;aspect-ratio:16/7;background:var(--surface-2);position:relative}
.map>svg{width:100%;height:100%;display:block}
.map-cap{position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.map-cap .ic{color:var(--brand);width:16px;height:16px}

/* Anfitrión */
.host{display:grid;grid-template-columns:380px minmax(0,1fr);gap:64px;align-items:start}
.host-card{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:28px 28px 28px 24px;border-radius:24px;box-shadow:var(--shadow-2);background:#fff}
.host-id{text-align:center}
.host-av{position:relative;width:104px;height:104px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px var(--line);color:var(--brand);display:grid;place-items:center;margin:0 auto}
.host-av>img{width:62px;height:auto}
.host-av .ver{position:absolute;right:-2px;bottom:4px;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;border:3px solid #fff}
.host-av .ver svg{width:14px;height:14px;stroke-width:3}
.host-id h3{font-size:20px;font-weight:700;margin-top:12px;letter-spacing:-.02em;line-height:1.15}
.host-id p{font-size:14px;color:var(--muted)}
.host-stats{min-width:112px;max-width:130px}
.host-stats div{padding:10px 0;border-bottom:1px solid var(--line)}
.host-stats div:last-child{border-bottom:0}
.host-stats b{display:block;font-size:22px;font-weight:700;line-height:1.1}
.host-stats span{font-size:11px;font-weight:600;line-height:1.2;display:block}
.host-info h3{font-size:18px;margin-bottom:12px}
.host-info ul{list-style:none;padding:0;margin:0 0 24px;display:grid;gap:8px;color:var(--body)}
.host-note{display:flex;gap:12px;align-items:flex-start;border-top:1px solid var(--line);margin-top:28px;padding-top:24px;font-size:12px;color:var(--muted);max-width:420px}
.host-note .ic{width:22px;height:22px;stroke-width:1.6;color:var(--brand)}

/* Ficha */
.d-title{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:24px 0}
.d-title h1{font-size:26px;font-weight:600;letter-spacing:-.01em}
.d-acts{display:flex;gap:4px}
.d-acts button{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:2px;transition:background .2s}
.d-acts button:hover{background:var(--surface)}
.d-acts .ic{width:16px;height:16px}
.d-acts .on svg{fill:var(--heart);stroke:var(--heart)}
.d-mosaic{position:relative;display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:repeat(2,minmax(0,1fr));gap:8px;height:clamp(300px,36vw,460px);border-radius:12px;overflow:hidden}
.d-mosaic>button{overflow:hidden;display:block;position:relative}
.d-mosaic>button img{width:100%;height:100%;object-fit:cover}
.d-mosaic>button::after{content:"";position:absolute;inset:0;background:#000;opacity:0;transition:opacity .2s}
.d-mosaic>button:hover::after{opacity:.12}
.d-mosaic>.m0{grid-row:1/3}
.d-mosaic.n4>.m1{grid-column:2/4}
.d-mosaic.n3{grid-template-columns:2fr 1fr}
.d-mosaic>.all-photos{position:absolute;right:24px;bottom:24px;background:#fff;box-shadow:inset 0 0 0 1px var(--ink);border-radius:8px;padding:7px 15px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;overflow:visible}
.d-mosaic>.all-photos::after{display:none}
.d-mosaic>.all-photos:hover{background:var(--surface)}
.d-mosaic>.all-photos .ic{width:16px;height:16px;stroke-width:1.8}
.dmm{display:none}
.d-body{display:grid;grid-template-columns:minmax(0,1fr) 376px;gap:7%;align-items:start}
.d-kind h2{font-size:22px;margin:0}
.d-kind p{font-size:16px;color:var(--body);margin-top:4px}
.fav-box{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:20px;border:1px solid var(--line);border-radius:12px;padding:20px 24px;margin-top:32px}
.fav-box .fb-l{display:flex;align-items:center;gap:2px;font-weight:700;font-size:14px;line-height:1.15;text-align:center;white-space:nowrap}
.fav-box .fb-l .laurel{width:18px;height:36px}
.fav-box .fb-m{font-size:14px;color:var(--muted);padding-left:20px;border-left:1px solid var(--line-soft);line-height:1.35}
.fav-box .fb-m b{display:block;font-size:16px;color:var(--ink);font-weight:600;margin-bottom:2px}
.fav-box .fb-r{display:flex;gap:24px;align-items:center}
.fav-box .fb-r>div{text-align:center}
.fav-box .fb-r b{display:block;font-size:20px;font-weight:700;line-height:1}
.fav-box .fb-r a{font-size:12px;font-weight:600}
.fav-box .stars{justify-content:center;margin-top:4px}
.fav-box .stars svg{width:9px;height:9px}
.fav-box .sep{width:1px;height:40px;background:var(--line)}
.host-line{display:flex;align-items:center;gap:20px;padding:24px 0;border-bottom:1px solid var(--line)}
.host-line .av-s{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px var(--line);color:var(--brand);display:grid;place-items:center;flex:none}
.host-line .av-s img{width:26px;height:auto}
.host-line b{display:block;font-weight:600}
.host-line span{font-size:14px;color:var(--muted)}
.sleep{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.sleep figure{margin:0}
.sleep .ph{border-radius:12px;overflow:hidden;aspect-ratio:3/2}
.sleep img{width:100%;height:100%;object-fit:cover}
.sleep b{display:block;margin-top:12px;font-weight:600}
.sleep span{font-size:14px;color:var(--muted)}
.d-side{position:relative;height:100%;padding-top:48px}
.book{position:sticky;top:calc(var(--hdr-compact) + var(--top) + 24px);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-1);padding:24px;background:#fff}
.bk-price{font-size:16px;margin-bottom:24px}
.bk-price b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.bk-fields{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--field);border-radius:8px}
.bk-f{text-align:left;padding:10px 12px;display:flex;flex-direction:column;position:relative;min-width:0;border-radius:8px;transition:box-shadow .15s}
.bk-f span{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.bk-f b{font-size:14px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-f:nth-child(2){border-left:1px solid var(--field)}
.bk-f.full{grid-column:1/3;border-top:1px solid var(--field)}
.bk-f.full .ic{position:absolute;right:14px;top:50%;margin-top:-8px}
.bk-f.active{box-shadow:inset 0 0 0 2px var(--ink);z-index:1}
.book .btn{margin-top:16px}
.bk-note{text-align:center;font-size:14px;color:var(--body);margin-top:12px}
.bk-lines{margin-top:24px;font-size:16px;color:var(--body);animation:fadeUp .35s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}}
.bk-line{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-variant-numeric:tabular-nums}
.bk-total{border-top:1px solid var(--line);margin-top:16px;padding-top:24px;font-weight:600;color:var(--ink)}
.bk-warn{margin-top:16px;font-size:14px;color:#C13515;display:flex;gap:8px}
.bk-warn button{font-weight:600;text-decoration:underline}
.book-below{text-align:center;margin-top:20px;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.inline-cal{max-width:720px}
.subnav{position:fixed;top:var(--top);left:0;right:0;z-index:60;background:#fff;border-bottom:1px solid var(--line);transform:translateY(calc(-100% - var(--top)));transition:transform .3s var(--ease)}
.subnav.show{transform:none}
.subnav .wrap-l{display:flex;align-items:center;justify-content:space-between;height:80px}
.subnav nav{display:flex;gap:24px;height:100%}
.subnav nav a{display:flex;align-items:center;font-size:14px;font-weight:600;text-decoration:none;border-bottom:4px solid transparent;padding-top:4px;transition:border-color .2s}
.subnav nav a:hover{border-bottom-color:var(--ink)}
.sn-book{display:flex;align-items:center;gap:24px;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.subnav.cta .sn-book{opacity:1;visibility:visible}
.sn-book .p{font-size:14px;text-align:right;line-height:1.3}
.sn-book .p b{font-size:18px}
.crumbs{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);padding:32px 0 8px;flex-wrap:wrap}
.crumbs a{text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.crumbs .ic{width:10px;height:10px;stroke-width:3}
.book-bar{display:none}
.mob{display:none}

/* Calendario */
.cal{position:relative}
.cal-nav{position:absolute;top:-6px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;z-index:1;transition:background .2s}
.cal-nav:hover{background:var(--surface)}
.cal-nav[disabled]{opacity:.25;cursor:default}
.cal-nav.prev{left:0}.cal-nav.next{right:0}
.cal-nav .ic{width:14px;height:14px;stroke-width:2.6}
.cal-months{display:grid;grid-template-columns:repeat(var(--m,2),minmax(0,1fr));gap:24px 48px}
.month h3{margin:0 0 16px;text-align:center;font-size:16px;font-weight:600}
.dow,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow span{font-size:12px;color:var(--muted);text-align:center;padding-bottom:8px;font-weight:600}
.day{height:44px;display:grid;place-items:center;font-size:14px;font-weight:600;padding:0;margin:1px 0;transition:background .15s}
.day span{width:min(44px,100%);height:44px;display:grid;place-items:center;border-radius:50%;transition:background .2s,color .2s,box-shadow .15s}
.day:hover:not([disabled]) span{box-shadow:inset 0 0 0 1.5px var(--ink)}
.day[disabled]{color:#C5C5C5;text-decoration:line-through;cursor:default;font-weight:500}
.day.rng,.day.hov{background:var(--surface-2)}
.day.is-in.has-out{background:linear-gradient(90deg,transparent 50%,var(--surface-2) 50%)}
.day.is-out{background:linear-gradient(90deg,var(--surface-2) 50%,transparent 50%)}
.day.is-in span,.day.is-out span{background:var(--ink);color:#fff}
.cal-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:12px;flex-wrap:wrap}
.cal-foot div{display:flex;gap:12px;align-items:center}

/* Popover */
.pop{position:absolute;z-index:60;background:#fff;border-radius:32px;box-shadow:var(--shadow-pop);padding:32px;animation:popIn .2s var(--ease)}
.pop[hidden]{display:none}
.pop.dates{width:min(850px,calc(100vw - 24px))}
.pop.guests,.pop.type{width:min(420px,calc(100vw - 24px))}
.pop.type{padding:16px}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.g-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line-soft)}
.g-row b{display:block;font-weight:600}
.g-row span{color:var(--muted);font-size:14px}
.step{display:flex;align-items:center;gap:16px}
.step button{width:32px;height:32px;border-radius:50%;border:1px solid var(--field);display:grid;place-items:center;color:var(--muted);transition:border-color .2s,color .2s,transform .1s}
.step button:hover:not([disabled]){border-color:var(--ink);color:var(--ink)}
.step button:active:not([disabled]){transform:scale(.9)}
.step button[disabled]{opacity:.3;cursor:not-allowed}
.step .ic{width:12px;height:12px;stroke-width:2.6}
.step output{min-width:16px;text-align:center}
.g-note{font-size:14px;color:var(--muted);margin-top:16px}
.t-opt{display:flex;gap:16px;align-items:center;width:100%;text-align:left;padding:12px 16px;border-radius:16px;transition:background .2s}
.t-opt:hover{background:var(--surface)}
.t-opt[aria-checked="true"]{background:var(--surface-2)}
.t-opt[aria-checked="true"] .tile{background:#fff}
.t-opt .tile{width:56px;height:56px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.t-opt .tile svg{width:44px;height:44px}
.t-opt b{display:block;font-weight:600}
.t-opt small{display:block;color:var(--muted);font-size:14px}

/* Hoja modal */
.sheet-wrap{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:40px 24px;animation:fade .25s}
.sheet{background:#fff;border-radius:12px;width:min(780px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-modal);animation:rise .4s var(--ease)}
.sheet.narrow{width:min(568px,100%)}
.sheet-h{display:grid;grid-template-columns:32px 1fr 32px;align-items:center;gap:12px;padding:0 24px;height:64px;border-bottom:1px solid var(--line-soft);flex:none}
.sheet-h h2{font-size:16px;text-align:center;font-weight:700}
.sheet-h .x{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;transition:background .2s}
.sheet-h .x:hover{background:var(--surface)}
.sheet-b{overflow:auto;padding:24px;overscroll-behavior:contain}
.sheet-b h3{font-size:22px;margin-bottom:16px}
.sheet-f{border-top:1px solid var(--line-soft);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex:none}
.ss-sec+.ss-sec{margin-top:24px;padding-top:24px;border-top:1px solid var(--line-soft)}
.ss-sec h3{font-size:22px;margin-bottom:12px}
.rs-top{display:flex;gap:16px;align-items:center;padding-bottom:24px;border-bottom:1px solid var(--line)}
.rs-top .ph{width:124px;height:106px;border-radius:12px;overflow:hidden;flex:none}
.rs-top img{width:100%;height:100%;object-fit:cover}
.rs-top b{display:block;font-size:16px}
.rs-top small{display:block;font-size:12px;color:var(--muted)}
.rs-top span{font-size:14px;color:var(--muted)}
.rs-dl{margin:0;padding:24px 0;border-bottom:1px solid var(--line);display:grid;gap:16px}
.rs-dl div{display:flex;justify-content:space-between;gap:16px}
.rs-dl dt{font-weight:600}
.rs-dl dd{margin:0;color:var(--body);text-align:right}
.rs-demo{display:flex;gap:12px;margin-top:24px;background:var(--surface);border-radius:12px;padding:16px;font-size:14px;color:var(--body)}
.rs-demo .ic{width:20px;height:20px;stroke-width:1.8;color:var(--brand)}
.bk-fine{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.4}
.ct-list{list-style:none;margin:0;padding:0}
.ct-list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line-soft)}
.ct-list li:last-child{border-bottom:0}
.ct-list small{display:block;color:var(--muted);font-size:13px}
.ct-list .v{display:block;font-weight:600;font-size:16px;user-select:all;overflow-wrap:anywhere}
.ct-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.copy-in{width:100%;height:48px;border:1px solid var(--field);border-radius:8px;padding:0 12px;font:inherit;font-size:14px;margin-top:12px;color:var(--ink);background:#fff}
.ct-note{font-size:13px;color:var(--muted);margin-top:16px}
.sheet-b h2.sheet-title{font-size:22px;margin-bottom:16px}
.exp-hero{border-radius:12px;overflow:hidden;aspect-ratio:16/9;margin-bottom:24px}
.exp-more{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:-16px 0 24px}
.exp-more>div{aspect-ratio:4/3;border-radius:8px;overflow:hidden}
.exp-more img{width:100%;height:100%;object-fit:cover}
.trio{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;height:clamp(180px,24vw,260px);border-radius:12px;overflow:hidden;margin:0 0 24px}
.trio button{display:block;overflow:hidden;position:relative;min-width:0}
.trio img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.trio button:hover img{transform:scale(1.03)}
.sg-ph{border-radius:12px;overflow:hidden;aspect-ratio:3/2}
.sg-ph img{width:100%;height:100%;object-fit:cover}
.exp-hero img{width:100%;height:100%;object-fit:cover}
.acts{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:16px 0 0}
.acts li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px}
.acts .ic{width:16px;height:16px;stroke-width:1.8}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(40px);opacity:0}}

/* Recorrido de fotos */
.tour{position:fixed;inset:0;z-index:85;padding-top:var(--sat);background:#fff;overflow:auto;animation:rise .4s var(--ease)}
.tour-top{position:sticky;top:0;z-index:2;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 24px;height:64px}
.tour-top .circ{border:0;width:36px;height:36px}
.tour-top .circ:hover{background:var(--surface)}
.tour-top .circ .ic{width:16px;height:16px;stroke-width:2.4}
.tour-body{max-width:820px;margin:0 auto;padding:8px 24px 80px}
.tour-body h2{font-size:26px;margin:16px 0 8px}
.tour-body>p{color:var(--muted);margin-bottom:32px}
.tour-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tour-grid figure{margin:0}
.tour-grid figure.wide{grid-column:1/3}
.tour-grid button{display:block;width:100%;aspect-ratio:3/2;overflow:hidden;position:relative}
.tour-grid figure.wide button{aspect-ratio:16/9}
.tour-grid img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.tour-grid button:hover img{transform:scale(1.02)}
.tour-grid figcaption{font-size:13px;color:var(--muted);padding:6px 0 12px}

/* Visor */
.lb{position:fixed;inset:0;z-index:90;padding-top:var(--sat);background:#000;color:#fff;display:flex;flex-direction:column;animation:fade .25s}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;flex:none}
.lb-x{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-weight:600;font-size:14px}
.lb-x:hover{background:rgba(255,255,255,.12)}
.lb-count{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.lb-track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0}
.lb-track::-webkit-scrollbar{display:none}
.lb-slide{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 96px 24px;min-height:0;margin:0}
.lb-slide img{max-width:100%;max-height:calc(100vh - 150px);object-fit:contain}
.lb-slide figcaption{font-size:14px;color:rgba(255,255,255,.8)}
.lb-nav{position:absolute;top:50%;margin-top:-24px;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.4);display:grid;place-items:center;color:#fff;transition:background .2s}
.lb-nav:hover{background:rgba(255,255,255,.12)}
.lb-nav .ic{width:16px;height:16px;stroke-width:2.6}
.lb-prev{left:24px}.lb-next{right:24px}

/* Toast */
.toast a{color:#fff;font-weight:600;margin-left:16px;text-decoration:underline;text-underline-offset:2px}
.toast.act{pointer-events:auto}
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:600;opacity:0;transition:opacity .3s,transform .4s var(--ease);z-index:100;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow-1)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Pie */
.foot{background:var(--surface);border-top:1px solid var(--line);margin-top:64px}
.foot-cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;padding:48px 0;border-bottom:1px solid var(--line)}
.foot h2{font-size:14px;font-weight:600;margin-bottom:12px}
.foot ul{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.foot a,.foot li>button{display:inline-block;text-decoration:none;font-size:14px;padding:5px 0}
.foot a:hover,.foot li>button:hover{text-decoration:underline}
.foot-bottom{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:24px 0;font-size:14px}
.foot-bottom .l{display:flex;flex-wrap:wrap;gap:4px 0}
.foot-bottom .r{display:flex;gap:24px;align-items:center;font-weight:600}
.foot-bottom .r span{display:flex;gap:8px;align-items:center}
.btab{display:none}

/* Vistas */
.view{animation:viewIn .35s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}}
.page-title{padding-top:32px}
.page-title h1{font-size:32px;font-weight:700;letter-spacing:-.02em}
.page-title p{color:var(--muted);margin-top:4px;font-size:16px}
::view-transition-old(root),::view-transition-new(root){animation-duration:.25s}
::view-transition-group(lx){animation-duration:.5s;animation-timing-function:cubic-bezier(.2,0,0,1)}
::view-transition-old(lx),::view-transition-new(lx){animation:none;mix-blend-mode:normal;height:100%;object-fit:cover}

/* Responsive */
.lead-h{padding-top:28px;max-width:720px}
.lead-h h1{font-size:clamp(24px,2.4vw,30px);line-height:1.15;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.lead-h p{margin-top:8px;color:var(--muted);font-size:16px;line-height:1.45;text-wrap:pretty}
.lead-h+.chips{padding-top:16px}
.faq{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:48px;padding:56px 0 8px;border-top:1px solid var(--line-soft);margin-top:48px}
.faq-h h2{font-size:22px;font-weight:600;letter-spacing:-.01em}
.faq-h p{color:var(--muted);margin-top:6px;font-size:16px}
.faq-l details{border-bottom:1px solid var(--line)}
.faq-l details:first-child{border-top:1px solid var(--line)}
.faq-l summary{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0;font-size:16px;font-weight:600;cursor:pointer;list-style:none;border-radius:4px}
.faq-l summary::-webkit-details-marker{display:none}
.faq-l summary .ic{flex:none;width:16px;height:16px;stroke-width:2.2;transition:transform .25s var(--ease)}
.faq-l details[open] summary .ic{transform:rotate(45deg)}
.faq-l details p{padding:0 40px 20px 0;color:var(--body);line-height:1.55;max-width:62ch}
.cta-band{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:stretch;margin-top:56px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff}
.cb-txt{padding:40px 40px 40px 40px;display:flex;flex-direction:column;justify-content:center}
.cb-txt h2{font-size:26px;font-weight:700;letter-spacing:-.02em}
.cb-txt p{margin-top:10px;color:var(--body);font-size:16px;line-height:1.5;max-width:44ch}
.cb-txt .acts-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.cb-ph{position:relative;min-height:280px;background:var(--surface-2)}
.cb-ph .fi,.cb-ph .noimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.foot address{font-style:normal;line-height:1.6;color:var(--body);font-size:14px}
.foot address b{display:block;color:var(--ink);font-weight:600}
.faq,.foot{content-visibility:auto;contain-intrinsic-size:auto 520px}

    const upd = () => { const i = Math.round(t.scrollLeft / Math.max(1, t.clientWidth)); dots.forEach((d, k) => d.classList.toggle('on', k === i)); prev.disabled = i <= 0; next.disabled = i >= dots.length - 1; };
    let raf; t.addEventListener('scroll', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(upd); }, { passive:true });
  });
  $$('.track', root).forEach(tr => {
    if (tr.dataset.bound) return; tr.dataset.bound = '1';
    const row = tr.closest('.row'); if (!row) return;
    const prev = $('[data-row-prev]', row), next = $('[data-row-next]', row);
    const nav = prev && prev.closest('.row-nav');
    const upd = () => { if (!prev) return; prev.disabled = tr.scrollLeft < 4; next.disabled = tr.scrollLeft + tr.clientWidth >= tr.scrollWidth - 4; if (nav) nav.hidden = tr.scrollWidth <= tr.clientWidth + 4; };
    tr.addEventListener('scroll', () => requestAnimationFrame(upd), { passive:true });
    if ('ResizeObserver' in window) new ResizeObserver(upd).observe(tr);
    requestAnimationFrame(upd); setTimeout(upd, 300);
  });
}

}

function monthHTML(d){
  const y = d.getFullYear(), m = d.getMonth();
  const lead = (new Date(y, m, 1).getDay() + 6) % 7, len = new Date(y, m + 1, 0).getDate();
  const a = S.inD && S.inD.getTime(), b = S.outD && S.outD.getTime();
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<span></span>';
  for (let k = 1; k <= len; k++) {
    const t = new Date(y, m, k).getTime(), c = ['day'];
    if (t === a) { c.push('is-in'); if (b) c.push('has-out'); }
    if (t === b) c.push('is-out');
    if (a && b && t > a && t < b) c.push('rng');
    cells += `<button type="button" class="${c.join(' ')}" data-ts="${t}"${t < TODAY ? ' disabled' : ''} aria-label="${new Date(t).toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long' })}"${t === a || t === b ? ' aria-pressed="true"' : ''}><span>${k}</span></button>`;
  }

const isRoute = h => !!h && (ROUTE_RE.test(h) || !!BY[h.slice(1)]);
let NAV_SKIP = false, NAV_INSIDE = false;
function navigate(href, morphImg, section){
  if (section) PENDING = section;
  NAV_INSIDE = true;
  const go = () => { if (location.hash !== href) { NAV_SKIP = true; location.hash = href; } route(); };
  if (!document.startViewTransition || RM) { go(); return; }
  if (morphImg) morphImg.style.viewTransitionName = 'lx';
  const vt = document.startViewTransition(() => {
    go();
    if (morphImg) { const t = innerWidth < 744 ? $('.dmm-track img') : $('.d-mosaic .m0 img'); if (t) t.style.viewTransitionName = 'lx'; }
  });
  vt.finished.finally(() => $$('img').forEach(im => { if (im.style.viewTransitionName) im.style.viewTransitionName = ''; }));
}
function route(){
  closePop(); closeSheets(); closeHdr();
  $$('.lb,.tour').forEach(x => x.remove()); lock();
  let h = ''; try { h = decodeURIComponent(location.hash.slice(1)); } catch (_) {}
  let m;
  if (BY[h]) return renderDetail(BY[h]);
  if (h === 'favoritos') return renderFavs();
  if ((m = h.match(/^experiencias?(?:-([\w-]+))?$/))) { renderView('exp'); if (m[1]) setTimeout(() => openExp(m[1]), 150); return; }
  if ((m = h.match(/^la-finca(?:-([\w-]+))?$/))) return renderView('finca', m[1]);
  renderView('stays');
}
window.addEventListener('hashchange', () => { if (NAV_SKIP) { NAV_SKIP = false; return; } route(); });

/* ==================================================================
   EVENTOS
=================================================================== */
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href*="wa.me/"]'); if (!a) return;
  if (a.dataset.waGen !== undefined) a.href = waLink(waGenMsg());
  const place = a.dataset.wa || a.dataset.waGen || (a.closest('.foot') ? 'pie' : a.closest('.hdr, #menuPop') ? 'menu' : a.closest('.sheet') ? 'ficha' : 'pagina');
  track('generate_lead', { method: 'whatsapp', ubicacion: place });
  if (a.hasAttribute('data-wa-ok')) setTimeout(() => toast('Te abrimos WhatsApp con tu solicitud. Si no se abre, escribe al 673 78 26 66'), 400);
}, true);
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details[data-faq]') && d.open) track('faq_open', { pregunta: FAQ[+d.dataset.faq][0] }); }, true);
document.addEventListener('click', e => {
  const T = e.target;
  const inPop = pop.contains(T);
  const menuPop = $('#menuPop'), menuBtn = $('#menuBtn');
  let el;
  if (!T.closest('#menuBtn') && !menuPop.hidden && !T.closest('#menuPop')) { menuPop.hidden = true; menuBtn.setAttribute('aria-expanded', 'false'); }

  if ((el = T.closest('a[href^="#"]')) && !el.hasAttribute('data-jump') && isRoute(el.getAttribute('href')) && !e.metaKey && !e.ctrlKey && !el.target) {
    e.preventDefault(); menuPop.hidden = true; closeSheets();
    const href = el.getAttribute('href');
    const tab = el.closest('.tab');
    if (tab) { tab.classList.remove('bump'); void tab.offsetWidth; tab.classList.add('bump'); }
    if ((el.dataset.brand !== undefined || tab) && href === (location.hash || '#inicio') && VIEW !== 'detail') { window.scrollTo({ top:0, behavior: RM ? 'auto' : 'smooth' }); return; }
    let morph = null;
    if (BY[href.slice(1)]) { const card = el.closest('.card'); if (card) { const tr = $('.c-track', card); if (tr && Math.round(tr.scrollLeft / Math.max(1, tr.clientWidth)) === 0) morph = $('.c-slide img', card); } }
    navigate(href, morph); return;
  }
  if ((el = T.closest('[data-jump]'))) { e.preventDefault(); jumpTo(el.dataset.jump); return; }
  if (T.closest('#menuBtn')) { const open = menuPop.hidden; menuPop.hidden = !open; menuBtn.setAttribute('aria-expanded', open); return; }
  if (T.closest('[data-open-hdr]')) { openHdr(); const seg = $('.search [data-pop="dates"]'); setTimeout(() => openPop('dates', seg, true), 320); return; }
  if (T === $('#hdrDim')) { closePop(); closeHdr(); return; }

  if ((el = T.closest('[data-cal-nav]'))) {
    const d = +el.dataset.calNav, host = el.closest('[data-cal]').dataset.cal;
    if (host === 'pop') { POP.start = addM(POP.start, d); renderPop(); } else { INL.start = addM(INL.start, d); renderInline(); }
    return;
  }
  if ((el = T.closest('.day')) && !el.disabled) { selectDay(+el.dataset.ts, el.closest('[data-cal]').dataset.cal); return; }
  if ((el = T.closest('[data-step]'))) {
    const [k, d] = el.dataset.step.split(':');
    const max = +(el.closest('[data-guests-box]').dataset.max || 24);
    if (k === 'adults') S.adults = Math.max(1, Math.min(S.adults + +d, max - S.kids));
    else S.kids = Math.max(0, Math.min(S.kids + +d, max - S.adults));
    S.guestsSet = true; refresh(); return;
  }
  if ((el = T.closest('[data-type]'))) {
    S.type = el.dataset.type; refresh();
    if (inPop && POP.box) { const nx = POP.box.querySelector('[data-pop="dates"]'); setTimeout(() => nx ? openPop('dates', nx, true) : closePop(), 160); }
    return;
  }
  if (T.closest('[data-clear-dates]')) { S.inD = S.outD = null; if (!pop.hidden) POP.focus = 'in'; refresh(); return; }
  if (T.closest('[data-close-pop]')) { closePop(); return; }
  if (T.closest('[data-go]')) { e.preventDefault(); doSearch(); return; }
  if ((el = T.closest('[data-pop]'))) { openPop(el.dataset.pop, el); return; }
  if (!inPop && !pop.hidden) closePop();

  if (T.closest('[data-sheet="search"]')) { openSearchSheet(); return; }
  if (T.closest('[data-clear]')) { Object.assign(S, { type:'all', cat:'todos', inD:null, outD:null, adults:2, kids:0, guestsSet:false }); $$('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.cat === 'todos')); refresh(); return; }
  if ((el = T.closest('[data-cat]'))) { S.cat = el.dataset.cat; track('select_filter', { categoria: S.cat }); $$('.chip').forEach(c => c.setAttribute('aria-pressed', c === el)); renderRows(); return; }
  if ((el = T.closest('[data-fav]'))) { e.preventDefault(); toggleFav(el.dataset.fav); return; }
  if ((el = T.closest('.c-prev, .c-next'))) { const tr = $('.c-track', el.closest('.c-media')); tr.scrollBy({ left: (el.classList.contains('c-next') ? 1 : -1) * tr.clientWidth, behavior: RM ? 'auto' : 'smooth' }); return; }
  if ((el = T.closest('[data-row-prev],[data-row-next]'))) { const tr = $('.track', el.closest('.row')); tr.scrollBy({ left: (el.hasAttribute('data-row-next') ? 1 : -1) * tr.clientWidth * .9, behavior: RM ? 'auto' : 'smooth' }); return; }
  if ((el = T.closest('[data-exp]'))) { openExp(el.dataset.exp); return; }
  if ((el = T.closest('[data-tour]'))) {
    if (el.dataset.tour === 'finca') openTour(FINCA_PHOTOS, 'Finca Los Olivos', 'Fotos de la finca, del spa, del restaurante y de Alcalá del Júcar');
    else if (CUR) openTour(photosOf(CUR), CUR.name, `${CUR.tag} · fotos del alojamiento y de la finca`);
    return;
  }
  if (T.closest('[data-amen]') && CUR) { openSheet({ title:'Qué ofrece este alojamiento', body:`<ul class="am-list">${CUR.am.map(amItem).join('')}</ul>` }); return; }
  if ((el = T.closest('[data-reserve]'))) { openReserve(BY[el.dataset.reserve], el); return; }
  if (T.closest('[data-share]')) { share(); return; }
  if (T.closest('[data-contact]')) { menuPop.hidden = true; openContact(); return; }
  if ((el = T.closest('[data-copy]'))) { const li = el.closest('li'); copyText(el.dataset.copy, 'Copiado', li && $('.v', li)); return; }
  if (T.closest('[data-back]')) { if (NAV_INSIDE && history.length > 1) history.back(); else navigate('#inicio'); return; }
  if (T.closest('[data-close]')) { closeSheet(); return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    const top = $('.lb') || (SHEETS.length ? SHEETS[SHEETS.length - 1].w : null) || $('.tour');
    if (!top) return;
    const f = $$('a[href],button:not([disabled]),input,[tabindex]:not([tabindex="-1"])', top).filter(x => x.getClientRects().length);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1], a = document.activeElement;
    if (!top.contains(a)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && a === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && a === last) { e.preventDefault(); first.focus(); }
    return;
  }
  if (e.key !== 'Escape') return;
  if (SHEETS.length) { closeSheet(); return; }
  const tour = $('.tour'); if (tour) { tour.remove(); lock(); return; }
  if (!pop.hidden) { const a = POP.anchor; closePop(); if (a) a.focus(); return; }
  if (hdr.classList.contains('open')) { closeHdr(); return; }
  const mp = $('#menuPop'); if (!mp.hidden) { mp.hidden = true; $('#menuBtn').focus(); }
});
document.addEventListener('mouseover', e => {
  const root = e.target.closest && e.target.closest('[data-cal]'); if (!root) return;
  const d = e.target.closest('.day');
  $$('.day.hov', root).forEach(x => x.classList.remove('hov'));
  if (!d || d.disabled || !S.inD || S.outD) return;
  const t = +d.dataset.ts, a = S.inD.getTime(); if (t <= a) return;
  $$('.day', root).forEach(x => { const xt = +x.dataset.ts; if (xt > a && xt < t) x.classList.add('hov'); });
});
document.addEventListener('pointermove', e => {
  const b = e.target.closest && e.target.closest('.btn-grad'); if (!b) return;
  const r = b.getBoundingClientRect();
  b.style.setProperty('--x', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%');
  b.style.setProperty('--y', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%');
}, { passive:true });
let lastY = window.scrollY, ticking = false;
window.addEventListener('scroll', () => {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => {
    ticking = false; updHdr();
    if (hdr.classList.contains('open') && Math.abs(window.scrollY - lastY) > 30) { closePop(); closeHdr(); }
    if (!pop.hidden && pop.style.position !== 'fixed' && Math.abs(window.scrollY - lastY) > 80) closePop();
    if (pop.hidden && !hdr.classList.contains('open')) lastY = window.scrollY;
  });
}, { passive:true });
let rz;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { positionPop(); if (VIEW === 'detail') { const m = innerWidth < 744 ? 1 : 2; if (m !== INL.months) { INL.months = m; renderInline(); } } }, 140); });

/* Arranque */
$$('[data-tic]').forEach(s => s.innerHTML = tabIcon(s.dataset.tic));
// metadatos al <head>: en el alojamiento de la propuesta el fragmento va dentro de <body>
if (document.head) $$('body meta[name], body meta[property]').forEach(m => document.head.appendChild(m));
schemaLD();
route();
})();
</script>
</body>
